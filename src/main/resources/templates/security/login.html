<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>

<header class="gnb">
    <div class="gnb__inner">
        <div class="logo">블로그</div>
        <nav class="menu">
            <a href="/">블로그 홈</a>
            <a href="/letter">글쓰기</a>
        </nav>
    </div>
</header>

<main class="container--single">
    <section class="card">
        <h3 style="margin:0 0 12px;">로그인</h3>

        <!-- 메시지 영역 -->
        <div th:if="${param.error}" class="label" style="color:#ef4444;">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <div th:if="${param.logout}" class="label" style="color:#16a34a;">
            로그아웃되었습니다.
        </div>

        <!-- 스프링 시큐리티가 처리: POST /login -->
        <form th:action="@{/login}" method="post">
            <!-- ✅ CSRF 토큰(스프링 시큐리티 기본 활성화) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-row">
                <label class="label" for="username">아이디</label>
                <input class="input" id="username" name="username" type="text" required autofocus />
            </div>

            <div class="form-row">
                <label class="label" for="password">비밀번호</label>
                <input class="input" id="password" name="password" type="password" required />
            </div>

            <!-- 옵션: 기억하기(세션 유지) -->
            <!-- <div class="form-row">
              <label class="label"><input type="checkbox" name="remember-me"> 로그인 유지</label>
            </div> -->

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">로그인</button>
            </div>
        </form>
    </section>
</main>

<footer class="footer">
    <div class="footer__inner">© 게시판프로젝트(개인)</div>
</footer>
</body>
</html>
