<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <title>새 글 쓰기</title>
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>

<header class="gnb">
    <div class="gnb__inner">
        <div class="logo">블로그</div>
        <nav class="menu">
            <span sec:authorize="isAuthenticated()">안녕하세요,
                <b sec:authentication="name">사용자</b>님!
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <a href="/">블로그 홈</a>
                    <button type="submit" class="link-btn">로그아웃</button>
                </form>
            </span>
        </nav>
    </div>
</header>

<!-- ✅ 단일 컬럼 레이아웃 -->
<main class="container--single">
    <!-- 작성 가이드 (상단 배너 카드) -->
    <section class="card">
        <h3 style="margin:0 0 8px;">작성 가이드</h3>
        <p style="margin:0; line-height:1.7;">
            제목과 본문을 입력한 뒤 <b>발행하기</b>를 누르면 내 블로그에 게시됩니다.<br/>
            필요 시 브라우저에 <b>임시저장</b>해 두었다가 이어서 작성할 수 있습니다.
        </p>
    </section>

    <!-- 새 글 쓰기 폼 -->
    <section class="card">
        <h3 style="margin:0 0 12px;">새 글 쓰기</h3>

        <form id="writeForm" th:action="@{/letter}" method="post">
            <input type="hidden" name="homeId" th:value="${home.id}"/>

            <!-- 제목 -->
            <div class="form-row">
                <label for="title" class="label">제목</label>
                <input id="title" name="title" type="text" placeholder="제목을 입력하세요"
                       required maxlength="120" class="input">
            </div>

            <!-- 카테고리 -->
            <div class="form-row">
                <label for="category" class="label">카테고리</label>
                <select id="category" name="category" class="select" style="max-width: 260px;">
                    <option value="" disabled selected>선택</option>
                    <option th:each="c : ${home.category}" th:value="${c}" th:text="${c}">DAILY</option>
                </select>
            </div>

            <!-- 본문 -->
            <div class="form-row">
                <label for="content" class="label">본문</label>
                <textarea id="content" name="story" class="textarea" placeholder="내용을 입력하세요" required></textarea>
                <div class="meta-line">
                    <span id="byteCounter">0자</span>
                    <button type="button" id="btnTemp" class="btn">임시저장</button>
                </div>
            </div>

            <!-- qr 입력 받기 -->
            <div class="form-row">
                <label for="qrUrl" class="label">QR URL (선택)</label>
                <input id="qrUrl" name="qrUrl" type="url" placeholder="https://example.com">
            </div>
            <div class="form-row">
                <label for="qrName" class="label">QR 이름 (선택)</label>
                <input id="qrName" name="qrName" type="text" placeholder="내 QR 코드 이름">
                <input type="hidden" name="size" value="240">
            </div>

            <!-- 버튼 -->
            <div class="form-actions">
                <button type="button" id="btnCancel" class="btn">취소</button>
                <button type="submit" class="btn btn-primary">발행하기</button>
            </div>
        </form>
    </section>
</main>

<footer class="footer">
    <div class="footer__inner">© 게시판프로젝트(개인)</div>
</footer>

<script>
    // 요소
    const $content = document.getElementById('content'); // ✅ id 통일
    const $title = document.getElementById('title');
    const $counter = document.getElementById('byteCounter');

    // 글자 수
    const updateCount = () => $counter.textContent = ($content.value || '').length + '자';
    $content.addEventListener('input', updateCount);
    updateCount();

    // 임시저장 (localStorage)
    const KEY = 'writer_draft';
    const saveDraft = () => {
        const data = {
            title: $title.value,
            category: document.getElementById('category').value,
            content: $content.value,
            ts: Date.now()
        };
        localStorage.setItem(KEY, JSON.stringify(data));
    };
    document.getElementById('btnTemp').addEventListener('click', saveDraft);

    // 자동 임시저장(디바운스)
    let t;
    document.getElementById('writeForm').addEventListener('input', () => { clearTimeout(t); t = setTimeout(saveDraft, 600); });

    // 기존 초안 불러오기
    const raw = localStorage.getItem(KEY);
    if (raw) {
        try {
            const d = JSON.parse(raw);
            $title.value = d.title || '';
            document.getElementById('category').value = d.category || '';
            $content.value = d.content || '';
            updateCount();
        } catch (e) {}
    }

    // 제출 시 임시저장 제거
    document.getElementById('writeForm').addEventListener('submit', () => localStorage.removeItem(KEY));

    // 취소 → 홈
    document.getElementById('btnCancel').addEventListener('click', () => window.location.href = '/');
</script>
</body>
</html>
